# common modals
windowrule = float on, match:title ^(Open)$
windowrule = float on, match:title ^(Choose Files)$
windowrule = float on, match:title ^(Save As)$
windowrule = float on, match:title ^(Confirm to replace files)$
windowrule = float on, match:title ^(File Operation Progress)$
# firefox child windows
windowrule = float on, match:title ^(Library)$

# Floating Apps
windowrule = float on, match:title  kcalc
windowrule = rounding 5, match:title  kcalc

windowrule = float on, match:title ^(lutris)$
windowrule = rounding 5, match:title ^(lutris)$

windowrule = float on, match:title ^(steam)$
windowrule = rounding 5, match:title ^(steam)$

windowrule = float on, match:title ^(thunar)$
windowrule = rounding 5, match:title ^(thunar)$
windowrule = opacity 0.92, match:title ^(thunar)$
#windowrule = size 1000 650, ^(thunar)$ # problem: makes prompt windows this size too!

windowrule = float on, match:title ^(discord)$
windowrule = rounding 5, match:title ^(discord)
windowrule = opacity 0.92, match:title ^(discord)

windowrule = float on, match:title KolourPaint
windowrule = rounding 5, match:title KolourPaint

# RuneLite
# wildcard to grab launcher
windowrule = float on, match:title ^(RuneLite.*)$
windowrule = rounding 5, match:title ^(RuneLite.*)$
windowrule = no_initial_focus on, match:title ^(RuneLite.*)$

windowrule = workspace 6, match:title ^(.*League.*)$
windowrule = workspace 6, match:title ^(.*Riot.*)$
windowrule = workspace 6, match:title ^(.*league.*)$
windowrule = workspace 6, match:title ^(.*riot.*)$
windowrule = workspace 6, match:title ^(.*lutris.*)$

# xxx rule can cause firefox windows with "explorer" in name to go transparent
#windowrule = opacity 0.00, match:title ^(.*explorer.*)$

# file manager window rules - thunar
windowrule = float on, match:title ^(Rename.*)$
windowrule = stay_focused on, match:title ^(Rename.*)$

# polkit window rules - kde
windowrule = fullscreen on on, match:title ^(lockscreen1)
windowrule = float on, match:title ^(Authentication.*)$
windowrule = stay_focused on, match:title ^(Authentication.*)$

windowrule = fullscreen on, match:title ^(lockscreen0)
windowrule = stay_focused on, match:title ^(lockscreen0)

# file manager window rules - thunar
windowrule = float on, match:title ^(Rename.*)$
windowrule = stay_focused on, match:title ^(Rename.*)$

# polkit window rules - kde
windowrule = fullscreen on, match:title ^(lockscreen1)
windowrule = float on, match:title ^(Authentication.*)$
windowrule = stay_focused on, match:title ^(Authentication.*)$

windowrule = fullscreen on, match:title ^(lockscreen0)
windowrule = stay_focused on, match:title ^(lockscreen0)
windowrule = workspace 1, match:title ^(lockscreen0)
windowrule = fullscreen on, match:title ^(lockscreen1)
windowrule = stay_focused on, match:title ^(lockscreen1)
windowrule = workspace 10, match:title ^(lockscreen1)

# flatpak chrome (set on background workspace with no follow/notifications for
# web scripting)
windowrule = float on, match:class ^(google-chrome)$
windowrule = no_initial_focus on, match:class ^(google-chrome)$
windowrule = workspace 11 silent, match:class ^(google-chrome)$

windowrule = float on, match:title ^(Transmission.*)$
windowrule = float on, match:class ^(transmission.*)$
windowrule = size 60% 60%, match:class ^(transmission.*)$

windowrule = float on, match:class ^(.*pavucontrol.*)$
windowrule = size 40% 70%, match:class ^(.*pavucontrol.*)$

windowrule = float on, match:class ^(thunar.*)$
windowrule = size 50% 50%, match:class ^(thunar.*)$

# Examples
