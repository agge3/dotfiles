# Agge's Hyprland UwU!

$root = $HOME/.config/hypr
$main_monitor=DP-2
$left_monitor=HDMI-A-1
$right_monitor=DP-1

# Monitor(s)
#monitor=$left_monitor,1920x1080@60,0x0,1
#monitor=DP-2,disable
monitor=$main_monitor,2560x1440@165,0x0,1,bitdepth,10
#monitor=$right_monitor,1920x1080@60,4480x0,1
#monitor = , preferred, auto, auto

# Execute
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = $root/xdg-portal-hyprland

# all startup apps in script, exec-once all
exec-once = $root/scripts/startup-apps.sh

# reposition monitors after monitor off/on
exec-once = $root/scripts/handle-monitor-connect.sh
# xxx might need to add waybar handling here too!

# watchdog to hotreload ghostty if config changes
exec-once = $root/scripts/ghostty-hotreload.sh

# layout:
#   10/0 -> hdmi, working
#   1,2 -> dp, working
#       for now 4 workspaces
#
#   [x] 9 -> don't need virt-manager? -> KeePassXC
#   [x] 8 -> zim (I think full scr?)
#   [x] 7 -> dolphin for file browsing
#   [x] 6 -> discord (do I want full scr?)
#   [x] 5 -> want open for full scr?
#   [maybe] 4 -> want open for full scr?
#
#   want 5 icons to show ->
#       start at 5 or 1?
#           start at 1, 5 open for full scr -> maybe dif keybind
#
# Implement layout ->
# note: first available empty workspace: "empty"
workspace = 9, monitor:$left_monitor, default:true, persistent:true
workspace = 1, monitor:$main_monitor, default:true, persistent:true
workspace = 10, monitor:$right_monitor, default:true, persistent:true
#exec = [workspace 9 silent;fakefullscreen;opacity 0.92] virt-manager
exec = [workspace 8 silent;fakefullscreen;opacity 0.92] keepassxc
exec = [workspace 7 silent;fakefullscreen;opacity 0.92] zim
#exec = [workspace 6 silent;fakefullscreen;opacity 0.92] lutris # don't like lutris autostarting
#exec-once = [workspace 8 silent;fullscreen on;opacity 0.95] dolphin

# Workspace Rules
#workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:$main_monitor
workspace = 3, monitor:$main_monitor
workspace = 4, monitor:$main_monitor
workspace = 5, monitor:$main_monitor
workspace = 6, monitor:$main_monitor
workspace = 7, monitor:$main_monitor
workspace = 8, monitor:$main_monitor
#workspace = 9, monitor:$right_monitor
# workspace = 10, monitor:HDMI-A-2, default:true

workspace = 11, monitor:$main_monitor
workspace = 12, monitor:$main_monitor
workspace = 13, monitor:$main_monitor
workspace = 14, monitor:$main_monitor
workspace = 15, monitor:$main_monitor
workspace = 16, monitor:$main_monitor
workspace = 17, monitor:$main_monitor
workspace = 18, monitor:$main_monitor
workspace = 19, monitor:$main_monitor
workspace = 20, monitor:$main_monitor

# ANIMATION SETTINGS ##
#animation=windows,1,1,default,slide

# Window Rules
#windowrule = workspace 8 silent,KeePassXC
#windowrule = workspace 9 silent,virt-manager
#windowrule = workspace # silent,dolphin # dolphin full src for browsing
#   to be portal for file browsing, but have mini instances open floating/small
#windowrule = workspace # silent,gimp # or krita, for editing
